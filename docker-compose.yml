version: '3.8'

services:
  # PostgreSQL Datenbank
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-crm-db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-waldseilgarten_crm}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - waldseilgarten-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-waldseilgarten_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: docker.io/redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-crm-redis}
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_redis_password}
    volumes:
      - ./data/redis:/data
    networks:
      - waldseilgarten-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-crm-backend}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-waldseilgarten_crm}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      DOCUMENT_STORAGE_PATH: /app/uploads/documents
      # API Configuration
      API_TITLE: ${API_TITLE:-Waldseilgarten CRM API}
      API_DESCRIPTION: ${API_DESCRIPTION:-API Documentation for Waldseilgarten CRM}
      API_VERSION: ${API_VERSION:-1.0}
      # CORS Configuration
      FRONTEND_URL: https://crm.waldseilgarten-herrenberg.de
      CORS_ORIGINS: ${CORS_ORIGINS:-https://crm.waldseilgarten-herrenberg.de,http://localhost:3000,http://localhost:5173}
    volumes:
      - ./data/uploads/documents:/app/uploads/documents
    networks:
      - waldseilgarten-network
      - traefik-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm-api.rule=Host(`api.waldseilgarten-herrenberg.de`)"
      - "traefik.http.routers.crm-api.entrypoints=websecure"
      - "traefik.http.routers.crm-api.tls.certresolver=le"
      - "traefik.http.services.crm-api.loadbalancer.server.port=3001"
      - "traefik.docker.network=traefik-network"

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.waldseilgarten-herrenberg.de
        VITE_APP_NAME: Waldseilgarten CRM
        VITE_COMPANY_NAME: Waldseilgarten Herrenberg
    container_name: ${FRONTEND_CONTAINER_NAME:-crm-frontend}
    restart: unless-stopped
    networks:
      - waldseilgarten-network
      - traefik-network
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm-frontend.rule=Host(`crm.waldseilgarten-herrenberg.de`)"
      - "traefik.http.routers.crm-frontend.entrypoints=websecure"
      - "traefik.http.routers.crm-frontend.tls.certresolver=le"
      - "traefik.http.services.crm-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-network"

networks:
  waldseilgarten-network:
    driver: bridge
  traefik-network:
    external: true
