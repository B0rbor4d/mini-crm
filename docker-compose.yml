version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: waldseilgarten-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: waldseilgarten
      POSTGRES_PASSWORD: changeme_secure_password
      POSTGRES_DB: waldseilgarten_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - waldseilgarten
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waldseilgarten -d waldseilgarten_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: waldseilgarten-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - waldseilgarten
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waldseilgarten-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - waldseilgarten
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.waldseilgarten-api.rule=Host(`crm.waldseilgarten-herrenberg.de`) && PathPrefix(`/api`)"
      - "traefik.http.routers.waldseilgarten-api.entrypoints=websecure"
      - "traefik.http.routers.waldseilgarten-api.tls.certresolver=le"
      - "traefik.http.services.waldseilgarten-api.loadbalancer.server.port=3001"
      - "traefik.http.routers.waldseilgarten-api.priority=10"

  frontend:
    image: nginx:alpine
    container_name: waldseilgarten-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - waldseilgarten
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.waldseilgarten.rule=Host(`crm.waldseilgarten-herrenberg.de`)"
      - "traefik.http.routers.waldseilgarten.entrypoints=websecure"
      - "traefik.http.routers.waldseilgarten.tls.certresolver=le"
      - "traefik.http.services.waldseilgarten.loadbalancer.server.port=80"
      - "traefik.http.routers.waldseilgarten.priority=1"

volumes:
  postgres_data:
  redis_data:

networks:
  waldseilgarten:
    internal: true
  traefik:
    external: true
